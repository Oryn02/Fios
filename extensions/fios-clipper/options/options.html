<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fios Clipper Options</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        max-width: 420px;
        margin: 24px auto;
        padding: 0 16px;
        color: #0f172a;
        background: #f8fafc;
      }
      h1 { font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em; }
      label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; margin: 12px 0 4px; color: #64748b; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
      button { margin-top: 16px; padding: 10px 14px; border: 0; border-radius: 10px; background: #14b8a6; color: #020617; font-weight: 800; text-transform: uppercase; font-size: 12px; cursor: pointer; }
      #status { margin-top: 10px; font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <h1>Fios Clipper</h1>
    <p style="font-size:12px;color:#64748b">API base URL + Supabase access token for <code>POST /api/clipper/clip</code>.</p>
    <label for="apiBase">API base URL</label>
    <input id="apiBase" placeholder="https://your-fios-api.onrender.com" />
    <label for="token">Supabase access token</label>
    <input id="token" type="password" placeholder="Paste session access_token" />
    <label for="gemini">Optional Gemini key</label>
    <input id="gemini" type="password" />
    <label for="moduleCode">Default module code</label>
    <input id="moduleCode" placeholder="COMP1234" />
    <button id="save" type="button">Save</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
