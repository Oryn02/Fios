<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fios Clipper</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0f1419;
        --fg: #e8eef4;
        --muted: #8b9aab;
        --accent: #34d399;
        --border: #243041;
      }
      body {
        margin: 0;
        font: 12px/1.4 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        width: 320px;
        padding: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 8px 0 4px;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #161d27;
        color: var(--fg);
        padding: 8px;
        font: inherit;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        border: 0;
        border-radius: 8px;
        padding: 9px 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        cursor: pointer;
        background: var(--accent);
        color: #052e1a;
      }
      button.secondary {
        background: #1c2533;
        color: var(--fg);
        border: 1px solid var(--border);
      }
      #status {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
        min-height: 1.2em;
      }
      details {
        margin-top: 10px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>Clip to Fios</h1>
    <label>Title</label>
    <input id="title" />
    <label>Selected / page text</label>
    <textarea id="text"></textarea>
    <label>Mode</label>
    <select id="mode">
      <option value="deck">Flashcard deck</option>
      <option value="audio-recap">Audio recap</option>
    </select>
    <div class="row">
      <button type="button" id="clip">Clip</button>
      <button type="button" class="secondary" id="refresh">Refresh</button>
    </div>
    <p id="status"></p>
    <details>
      <summary>API settings</summary>
      <label>API base (Render web service)</label>
      <input id="apiBase" placeholder="https://fios-akjy.onrender.com" />
      <label>Supabase access token (Bearer)</label>
      <input id="token" type="password" autocomplete="off" />
      <label>Optional Gemini key</label>
      <input id="gemini" type="password" autocomplete="off" />
      <label>Module code</label>
      <input id="moduleCode" placeholder="SOFT06001" />
      <div class="row">
        <button type="button" class="secondary" id="saveSettings">Save settings</button>
      </div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
