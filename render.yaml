# Fios — Render Blueprint
#
# Confirmed production API: https://fios-akjy.onrender.com (service Fios / srv-das193rbc2fs738u2rug)
#
# NEVER set Root Directory to `src` / `server/src` / `client/src`
# (ENOENT …/src/package.json).
#
# Prefer Option A (single Web Service) when you only have one Render service.

services:
  # --- Option A: one Web Service serves API + Vite SPA ---
  # Dashboard: clear Root Directory (repo root), then:
  #   Build:  npm run build
  #   Start:  npm start
  # Leave VITE_API_URL empty (same-origin /api).
  - type: web
    name: Fios
    runtime: node
    plan: free
    # rootDir omitted = repository root (required so client/ is in the build)
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      # Bake same-origin client (empty VITE_API_URL). Set Supabase keys in dashboard.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_DEMO_MODE
        value: "false"
      # Web Push (class reminders) — generate: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # --- Option B: keep API-only at server/ + optional Static Site ---
  # Use if Root Directory must stay `server/`.
  # Then create a Static Site (rootDir client) with:
  #   VITE_API_URL=https://fios-akjy.onrender.com
  - type: web
    name: fios-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev so `tsc` is available even when NODE_ENV=production
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  - type: web
    name: fios-web
    runtime: static
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        value: https://fios-akjy.onrender.com
      - key: VITE_ADMIN_UID
        sync: false
      - key: VITE_DEMO_MODE
        value: "false"
