# Fios — Render Blueprint (monorepo)
# Dashboard Root Directory must be `server` or `client` (where package.json lives),
# NEVER `src` / `server/src` / `client/src` — that causes:
#   ENOENT: … open '/opt/render/project/src/package.json'
#
# After first deploy, set secrets in the Render dashboard (see README).

services:
  # Express API (Web Service)
  - type: web
    name: fios-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

  # Vite/React static frontend
  - type: web
    name: fios-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_ADMIN_UID
        sync: false
      - key: VITE_DEMO_MODE
        value: "false"
